services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-novatech}
      POSTGRES_USER: ${DATABASE_USERNAME:-novatech}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-novatech}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  strapi:
    build: .
    env_file: .env
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_SSL: "false"
    ports:
      - "1337:1337"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  db-data:
